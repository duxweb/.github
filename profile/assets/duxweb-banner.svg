<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DuxWeb banner</title>
  <desc id="desc">A refined banner for the DuxWeb organization, showing a modular application architecture from microkernel to business systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07110F"/>
      <stop offset="0.52" stop-color="#0D1B17"/>
      <stop offset="1" stop-color="#18231A"/>
    </linearGradient>
    <linearGradient id="line" x1="236" y1="209" x2="1042" y2="209" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F36B" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#B7F36B"/>
      <stop offset="0.5" stop-color="#75E6B6"/>
      <stop offset="0.88" stop-color="#E8B45B"/>
      <stop offset="1" stop-color="#E8B45B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 210) rotate(90) scale(250 520)">
      <stop stop-color="#75E6B6" stop-opacity="0.2"/>
